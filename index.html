<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penasihat Catur Taktis</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121214; color: #fff; text-align: center; margin: 0; padding: 20px; }
    #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #1e1e24; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #333; }
    .btn { padding: 10px 20px; margin: 5px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; transition: 0.2s; }
    .btn-white { background: #edf2f4; color: #111; }
    .btn-black { background: #4a4e69; color: #fff; }
    .btn-danger { background: #e63946; color: #fff; }
    .btn-action { background: #3a86ff; color: #fff; }
    .btn:hover { transform: scale(1.05); }
    #board-container { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
    #board { width: 400px; max-width: 95vw; }
    .info-card { background: #1e1e24; margin-top: 15px; padding: 15px 25px; border-radius: 8px; max-width: 400px; width: 90vw; border: 1px solid #333; }
    .highlight { color: #00ff87; font-weight: bold; font-size: 20px; display: block; margin-top: 5px; }
    .turn-info { color: #ffbe0b; font-weight: bold; }
  </style>
</head>
<body>

  <div id="modal">
    <div class="modal-box">
      <h2>Pilih Warna Bidak Kamu</h2>
      <button class="btn btn-white" onclick="selectColor('white')">Putih</button>
      <button class="btn btn-black" onclick="selectColor('black')">Hitam</button>
    </div>
  </div>

  <h2>Penasihat Catur Taktis</h2>
  
  <div id="board-container">
    <div id="board"></div>
    <div class="info-card">
      <p>Status: <span id="turnStatus" class="turn-info">Menunggu...</span></p>
      <p>Rekomendasi: <span id="recommendation" class="highlight">-</span></p>
      <button class="btn btn-action" onclick="undoMove()">Undo</button>
      <button class="btn btn-danger" onclick="resetGame()">Reset</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script>
    var board = null;
    var game = new Chess();
    var playerColor = 'white';

    function selectColor(color) {
      playerColor = color;
      document.getElementById('modal').style.display = 'none';
      
      // Menggunakan CDN resmi untuk gambar
      board = Chessboard('board', {
        draggable: true,
        position: 'start',
        orientation: playerColor,
        onDrop: handleMove,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      });
      updateGameState();
    }

    function handleMove(source, target) {
      var move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      updateGameState();
    }

    function undoMove() { game.undo(); board.position(game.fen()); updateGameState(); }
    function resetGame() { game.reset(); board.position('start'); document.getElementById('modal').style.display = 'flex'; }

    function updateGameState() {
      var currentTurn = game.turn() === 'w' ? 'white' : 'black';
      if (game.game_over()) { document.getElementById('turnStatus').innerText = "Game Over!"; return; }

      if (currentTurn === playerColor) {
        document.getElementById('turnStatus').innerText = "GILIRAN KAMU!";
        fetchBestMove(game.fen());
      } else {
        document.getElementById('turnStatus').innerText = "GILIRAN LAWAN";
        document.getElementById('recommendation').innerText = "Masukkan langkah adik...";
      }
    }

    function fetchBestMove(fen) {
      document.getElementById('recommendation').innerText = "Menganalisis...";
      fetch('https://stockfish.online/api/s/v2.php?fen=' + encodeURIComponent(fen) + '&depth=10')
        .then(res => res.json())
        .then(data => {
          if (data.success && data.bestmove) {
            var m = data.bestmove.split(' ')[1];
            document.getElementById('recommendation').innerText = m.substring(0, 2).toUpperCase() + " ➔ " + m.substring(2, 4).toUpperCase();
          }
        });
    }
  </script>
</body>
</html>
